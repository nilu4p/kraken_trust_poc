# KRAKEN-Trust — scalable deployment.
#
#   console (nginx, :80 → :443 HTTPS) ──► backend (API, FastAPI) ──► postgres (PostgreSQL 16 + TimescaleDB)
#                                        │      ▲                 ▲
#                                        ▼      │                 │
#                                      redis (shared state, locks, Celery broker)
#                                        ▲
#        worker (rules, SLA, notifications) · worker-scan (Sentinel-1) · beat (scheduler)
#        collector (AIS aisstream + AISHub + VesselAPI)
#        xview3 (optional, `make up-ai`: information-only AI opinion on radar targets)
#        certbot (Let's Encrypt certificate for DOMAIN, renewed automatically)
#
# Passwords and the master key are docker secrets generated by `make secrets` (secrets/, never committed).

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

x-backend-image: &backend-image
  build:
    context: ./backend
    target: production
    args:
      APP_UID: ${APP_UID:-1000}
  image: kraken-backend:local

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  KEYS_DIR: /keys
  PREUVES_DIR: /preuves
  CACHE_DIR: /cache
  DATA_DIR: /data
  BACKUP_DIR: /backups
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql://kraken@postgres:5432/kraken
  DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
  REDIS_URL: redis://redis:6379/0
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  # Master key outside the keys/ volume (and therefore outside backups).
  MASTER_KEY_FILE: /run/secrets/master_key
  # Optional xView3 second opinion (information only): `make up-ai` sets it to http://xview3:8091.
  XVIEW3_URL: ${XVIEW3_URL:-}
  # Set CELERY_BROKER_URL=amqp://… to use RabbitMQ instead of Redis as the task broker.
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-}
  BACKGROUND_MODE: workers
  # PoC: local notification sink trusted over plain http (see notif-sink/).
  WEBHOOK_ALLOWED_HOSTS: '["notif-sink"]'
  # One sink channel per SOC channel (alertes, escalades, sla, surveillance, operations, securite).
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://notif-sink:8090/hooks/__CHANNEL__}
  # The console is served over HTTPS only (nginx redirects HTTP): session cookies are Secure.
  COOKIE_SECURE: "true"
  PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN:-localhost}}

x-backend-secrets: &backend-secrets
  - postgres_password
  - redis_password
  - master_key

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: kraken-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: kraken
      POSTGRES_USER: kraken
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TIMESCALEDB_TELEMETRY: "off"
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published: reachable only from the application containers.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kraken -d kraken"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4.1-alpine
    container_name: kraken-redis
    <<: *hardening
    user: "999:1000"
    secrets:
      - redis_password
    command: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_password)\" --appendonly yes --dir /data --maxmemory 256mb --maxmemory-policy noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: [*hardening, *backend-image]
    container_name: kraken-engine
    # API reachable only through the nginx front (and from this host for diagnostics).
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    secrets: *backend-secrets
    volumes:
      - ./keys:/keys
      - ./preuves:/preuves
      - ./cache:/cache
      - ./data:/data
      - ./backups:/backups
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 24/7 rules, SLA watch, source health, hourly maintenance, webhook deliveries (retried).
  worker:
    <<: [*hardening, *backend-image]
    container_name: kraken-worker
    command: ["celery", "-A", "app.worker", "worker", "-Q", "default,notify", "-c", "2", "-n", "general@%h",
              "--without-gossip", "--without-mingle", "-l", "INFO"]
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    secrets: *backend-secrets
    volumes:
      - ./keys:/keys
      - ./cache:/cache
      - ./preuves:/preuves
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy
    # Unhealthy if the worker stops answering (stuck process): Docker shows it, restart policy acts.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d general@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 40s

  # Sentinel-1 analysis: one scan at a time, fresh process after each (frees GDAL memory).
  worker-scan:
    <<: [*hardening, *backend-image]
    container_name: kraken-worker-scan
    command: ["celery", "-A", "app.worker", "worker", "-Q", "scan", "-c", "1", "--max-tasks-per-child", "1",
              "-n", "scan@%h", "--without-gossip", "--without-mingle", "-l", "INFO"]
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    secrets: *backend-secrets
    volumes:
      - ./keys:/keys
      - ./cache:/cache
      - ./preuves:/preuves
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d scan@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 40s

  # Scheduler: emits the periodic ticks (exactly one beat per deployment).
  beat:
    <<: [*hardening, *backend-image]
    container_name: kraken-beat
    command: ["celery", "-A", "app.worker", "beat", "-l", "INFO", "-s", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    secrets: *backend-secrets
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy

  # Continuous AIS picture (aisstream.io stream + AISHub / VesselAPI pollers), independent of the API.
  collector:
    <<: [*hardening, *backend-image]
    container_name: kraken-collector
    command: ["python", "-m", "app.collector"]
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    secrets: *backend-secrets
    volumes:
      - ./keys:/keys
      - ./cache:/cache
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy
    # Healthy while the collector can reach the shared state (Redis) it reports to.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; from app.core import shared; sys.exit(0 if shared.ping() else 1)"]
      interval: 60s
      timeout: 15s
      retries: 3

  # Console KRAKEN (nginx). HTTPS on 443 (Let's Encrypt certificate for DOMAIN, self-signed
  # until issued); port 80 only answers the ACME challenge and redirects to HTTPS.
  # Published on this host only unless CONSOLE_BIND=0.0.0.0 (server reachable from internet).
  console:
    <<: *hardening
    build:
      context: ./frontend
    container_name: kraken-console
    ports:
      - "${CONSOLE_BIND:-127.0.0.1}:${HTTP_PORT:-80}:8080"
      # Former console address (http://<host>:8080): same plain-HTTP server, redirected to HTTPS.
      - "${CONSOLE_BIND:-127.0.0.1}:${HTTP_ALT_PORT:-8080}:8080"
      - "${CONSOLE_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:8443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - certbot-www:/var/www/certbot:ro
      - tls-certs:/certs:ro
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy
      docs:
        condition: service_started

  # Knowledge base (MkDocs Material, static): served through the console at
  # http://localhost:8080/docs/ — not published on its own port.
  docs:
    <<: *hardening
    build:
      context: ./docs
    container_name: kraken-docs
    tmpfs:
      - /tmp

  # Test runner (make test / make test-pg): production image + pytest, never started by `make up`.
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
      args:
        APP_UID: ${APP_UID:-1000}
    image: kraken-backend:test
    environment:
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    tmpfs:
      - /tmp

  # Optional (make up-ai): xView3 first-place model (MIT) giving an information-only opinion on radar
  # targets. Weights (79 MB) are downloaded on first start and checked by SHA-256.
  xview3:
    <<: *hardening
    profiles: ["ai"]
    build:
      context: ./xview3
    image: kraken-xview3:local
    container_name: kraken-xview3
    volumes:
      - xview3models:/models
    tmpfs:
      - /tmp
    environment:
      XVIEW3_THREADS: ${XVIEW3_THREADS:-2}

  # Let's Encrypt (HTTP-01 through the console's port 80). Issues the certificate for DOMAIN
  # (LETSENCRYPT_EMAIL for expiry notices), checks renewal twice a day and hands nginx a copy
  # it can read (tls-certs volume, uid 101). Idle when DOMAIN is empty (local use).
  # LETSENCRYPT_STAGING=1: test certificates (not trusted) while trying out the setup.
  certbot:
    image: certbot/certbot:v3.0.1
    container_name: kraken-certbot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    environment:
      DOMAIN: ${DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-0}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - tls-certs:/certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap exit TERM
        if [ -z "$$DOMAIN" ]; then echo "DOMAIN not set: no Let's Encrypt certificate (self-signed in use)"; exec sleep infinity; fi
        staging=""; [ "$$LETSENCRYPT_STAGING" = "1" ] && staging="--staging"
        email="--register-unsafely-without-email"; [ -n "$$LETSENCRYPT_EMAIL" ] && email="--email $$LETSENCRYPT_EMAIL"
        sleep 10  # console up and answering on port 80
        while :; do
          if certbot certonly --webroot -w /var/www/certbot -d "$$DOMAIN" $$email $$staging                --agree-tos --no-eff-email --non-interactive --keep-until-expiring; then
            live=/etc/letsencrypt/live/$$DOMAIN
            # chmod before chown (changing the mode of a file owned by uid 101 would need
            # CAP_FOWNER), then an atomic rename so nginx never reads a half-written file.
            for f in fullchain:644 privkey:600; do
              name=$${f%%:*}; mode=$${f##*:}
              cp "$$live/$$name.pem" "/certs/$$name.pem.new"
              chmod "$$mode" "/certs/$$name.pem.new"
              chown 101:101 "/certs/$$name.pem.new"
              mv -f "/certs/$$name.pem.new" "/certs/$$name.pem"
            done
            wait_s=43200
          else
            echo "Certificate request failed: is $$DOMAIN pointing to this server and port 80 open?"
            wait_s=900   # Let's Encrypt limits failed attempts: do not retry too fast
          fi
          sleep $$wait_s & wait $$!
        done
    depends_on:
      - console

  # PoC only: local stand-in for Slack / Mattermost. Viewed through the console at
  # https://<domain>/notifs/ (platform login required); the direct port stays on this host.
  notif-sink:
    <<: *hardening
    build:
      context: ./notif-sink
    container_name: notif-sink
    ports:
      - "127.0.0.1:8090:8090"

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  master_key:
    file: ./secrets/master_key

volumes:
  pgdata:
  redisdata:
  xview3models:
  letsencrypt:
  certbot-www:
  tls-certs:
