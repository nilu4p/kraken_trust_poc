[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    # Third-party: FastAPI's TestClient still wraps httpx (test-only, no runtime impact).
    ignore::DeprecationWarning:fastapi.testclient
    ignore:Using `httpx` with `starlette.testclient`
    # Expected: the GCP test GeoTIFF is created first, then given its ground control points.
    ignore::rasterio.errors.NotGeoreferencedWarning
