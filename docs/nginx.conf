server_tokens off;

# Static knowledge base. Security headers are set by the console proxy
# (frontend/nginx.conf, location /docs/), which is the only entry point.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Relative redirects (/docs/x → /docs/x/): never leak the internal host name.
    absolute_redirect off;

    location = / { return 302 /docs/; }

    location /docs/ {
        expires 1h;
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /docs/404.html;
}
