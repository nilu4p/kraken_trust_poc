server_tokens off;

# Defence in depth in front of the API's own limits (per account, per address, lockout):
# login attempts per client address, and slow-client timeouts.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;
client_header_timeout 15s;
client_body_timeout 15s;
send_timeout 30s;

# JSON feeds (AIS picture, GeoJSON layers) compress ~8-10x.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/geo+json application/javascript text/css text/plain image/svg+xml;

# --- Plain HTTP (host ports 80 and 8080): Let's Encrypt challenge, everything else → HTTPS
server {
    listen 8080 default_server;
    server_name _;

    # HTTP-01 challenge files written by the certbot service (shared read-only volume).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Container health probe (stays on plain HTTP inside the container network).
    location = /health {
        proxy_pass http://backend:8000;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (host port 443) ----------------------------------------------------------
# Certificate: /tmp/tls, kept in sync with the Let's Encrypt one by
# /docker-entrypoint.d/40-tls.sh (self-signed until the first certificate is issued).
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /tmp/tls/fullchain.pem;
    ssl_certificate_key /tmp/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # --- Security headers (SPA) -----------------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org https://tiles.maps.eox.at https://gibs.earthdata.nasa.gov https://geodes-portal.cnes.fr https://datahub.creodias.eu https://wmts.marine.copernicus.eu; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=(), clipboard-write=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Login: throttled per client address (burst for a mistyped password, then 10 / min).
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # File imports (Combined IUU list, VMS exports) may exceed the default 1 MB.
    location ~ ^/api/v1/(watchlist|maritime/vms|authorized)/import$ {
        client_max_body_size 10m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Session probe for the knowledge base: the platform's own login protects the docs
    # (every page, asset and the search index). 204 = logged in, 401 / 403 = not allowed.
    location = /_auth/check {
        internal;
        proxy_pass http://backend:8000/api/v1/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same probe, supervisor role or above (notification sink: the #securite channel shows
    # account names and client addresses).
    location = /_auth/check_supervisor {
        internal;
        proxy_pass http://backend:8000/api/v1/auth/check?role=supervisor;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Not logged in (or password change pending): login screen, then back to the page.
    location @docs_login {
        return 302 /?next=$request_uri;
    }

    # Logged in without the required role: a plain refusal (redirecting to the login screen
    # would bounce straight back here, forever).
    location @notifs_forbidden {
        default_type text/plain;
        return 403 "Acces reserve aux responsables et aux administrateurs de la plateforme.\n";
    }

    # Knowledge base (docs service). Static pages only; MkDocs Material needs a few
    # inline scripts, so this location carries its own (relaxed for scripts) CSP.
    # Any add_header here replaces the server-level ones: all are restated.
    location = /docs { return 301 /docs/; }
    location /docs/ {
        auth_request /_auth/check;
        error_page 401 403 = @docs_login;
        proxy_pass http://docs:8080;
        # Behind a login now: never kept by a shared cache, revalidated (session checked) on each visit.
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "private, no-cache" always;
        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=(), clipboard-write=(self)" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # PoC notification server (notif-sink), behind the platform login (supervisor role or above).
    # Its own CSP (inline page) is passed through: the server-level headers are restated
    # here without a CSP. Webhook intake (/hooks/) stays internal to the Docker network.
    location = /notifs { return 301 /notifs/; }
    location ^~ /notifs/hooks/ { return 403; }
    location /notifs/ {
        auth_request /_auth/check_supervisor;
        error_page 401 = @docs_login;
        error_page 403 = @notifs_forbidden;
        proxy_pass http://notif-sink:8090/;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=(), clipboard-write=(self)" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    # Never expose dotfiles or source maps.
    location ~ /\. { deny all; }
    location ~ \.map$ { deny all; }

    # Caching via "expires" (not add_header): an add_header here would drop the security headers above.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
